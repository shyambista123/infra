apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-deployment
  namespace: namespace-1
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: web-container
        image: host.docker.internal:80/demo/devops-demo:853b7d6
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: harbor-secret