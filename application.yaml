apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-boot-webapp-argo-application
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/shyambista123/infra
    targetRevision: HEAD
    path: devops-demo
  destination: 
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true